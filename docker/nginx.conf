server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Expo Router static export: try the exact file, then `<route>.html`,
    # then `<route>/index.html`, and finally fall back to the landing page.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Hashed Expo assets can be cached forever
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
